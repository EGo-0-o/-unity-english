dius:12px;padding:11px 12px;background:var(--card);color:var(--ink)}.entry small{display:block;color:var(--muted);font-size:12px}.entry strong{font-size:14px}.entry .arrow{color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:22px}.hidden{display:none!important}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:white;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}.toast.show{opacity:1}.install{background:#eef6ee;border:1px solid #c9e4ce;border-radius:15px;padding:12px;font-size:13px;margin-top:12px}.mark{min-width:100px}@media(min-width:600px){.app{padding-left:24px;padding-right:24px}.card{padding:28px;min-height:330px}.hero h1{font-size:30px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">◈ Unity 英语卡</div><div class="sub">为场景美术与关卡设计准备</div></div><button id="soundToggle" class="pill" aria-pressed="true">🔊 发音开启</button></header><section class="hero"><h1>从看懂英文，到独立搭建场景</h1><p>点单词查释义 · 听发音 · 学真实操作句子</p></section><div class="search"><input id="search" type="search" placeholder="搜索英文、中文或场景术语…" autocomplete="off"><button id="searchBtn" class="btn primary">搜索</button></div><div id="tabs" class="tabs"></div><div class="stats"><div class="stat"><strong id="totalCount">0</strong><span>词条与术语</span></div><div class="stat"><strong id="learnedCount">0</strong><span>已掌握</span></div><div class="stat"><strong id="reviewCount">0</strong><span>待复习</span></div></div><div class="progressline"><span id="progress"></span></div><div class="meta"><span id="counter">卡片 1 / 1</span><span id="kind">术语卡</span></div><section class="card" aria-live="polite"><div class="category" id="category">界面与导航</div><div class="term" id="term">Scene</div><div class="meaning" id="meaning">场景</div><div class="desc" id="desc"></div><div class="example" id="example"></div><div class="translation" id="translation"></div><div class="actions"><button id="speakWord" class="btn">🔊 播放单词</button><button id="speakSentence" class="btn">🔊 播放句子</button><button id="showMeaning" class="btn">释义提示</button></div></section><div class="detail" id="detail"><span class="hint">点击上方例句中的任意英文单词，查看中文词义。</span></div><div class="nav"><button id="prev" class="btn">← 上一张</button><button id="next" class="btn primary">下一张 →</button></div><div class="row section"><button id="known" class="btn green mark">✓ 标记掌握</button><button id="shuffle" class="btn">随机学习</button><button id="review" class="btn">复习未掌握</button></div><div id="installHelp" class="install"><b>添加到 iPhone 主屏幕：</b>用 Safari 打开此应用所在网页，点分享按钮，再选“添加到主屏幕”。如果直接打开本地文件，离线功能和安装方式可能受 iOS 限制。</div><section class="section"><div class="row"><h2>当前分类词汇</h2><span id="listCount" class="sub"></span></div><div id="wordList" class="list"></div><button id="more" class="btn" style="width:100%;margin-top:9px">显示更多词条</button></section><footer class="footer">版本 1.0 · 词汇覆盖常见工作流，不代表穷尽所有 Unity API。版本和插件可能影响菜单名称。</footer></main><div id="toast" class="toast" role="status"></div><script id="dictionary" type="application/json">{"entries":[{"term":"Unity","zh":"Unity 编辑器","desc":"游戏开发环境","example":"Open Unity and create a project.","translation":"打开 Unity 并创建项目。","category":"界面与导航"},{"term":"Unity Hub","zh":"Unity Hub","desc":"管理编辑器版本和项目的启动器","example":"Open Unity Hub to manage your projects.","translation":"打开 Unity Hub 管理项目。","category":"界面与导航"},{"term":"Editor","zh":"编辑器","desc":"用于编辑和运行项目的程序","example":"Open the Editor.","translation":"打开编辑器。","category":"界面与导航"},{"term":"Project","zh":"项目","desc":"包含场景、资源和设置的工程","example":"Create a new project.","translation":"创建一个新项目。","category":"界面与导航"},{"term":"Project Window","zh":"项目窗口","desc":"浏览工程资源的窗口","example":"Find the model in the Project window.","translation":"在项目窗口中找到模型。","category":"界面与导航"},{"term":"Scene","zh":"场景","desc":"可编辑的关卡或画面","example":"Save the scene.","translation":"保存场景。","category":"界面与导航"},{"term":"Scene View","zh":"场景视图","desc":"用于编辑和观察场景的视图","example":"Move the camera in the Scene view.","translation":"在场景视图中移动视角。","category":"界面与导航"},{"term":"Game View","zh":"游戏视图","desc":"预览玩家实际看到的画面","example":"Test the camera in Game view.","translation":"在游戏视图中测试摄像机。","category":"界面与导航"},{"term":"Hierarchy","zh":"层级面板","desc":"查看当前场景对象及父子关系","example":"Select the object in the Hierarchy.","translation":"在层级面板中选择对象。","category":"界面与导航"},{"term":"Inspector","zh":"检视面板","desc":"查看和修改对象属性及组件","example":"Change the scale in the Inspector.","translation":"在检视面板中修改缩放。","category":"界面与导航"},{"term":"Console","zh":"控制台","desc":"显示日志、警告和错误","example":"Check the Console for errors.","translation":"检查控制台中的错误。","category":"界面与导航"},{"term":"Toolbar","zh":"工具栏","desc":"放置常用工具和运行控制","example":"Use the toolbar to enter Play mode.","translati tion":"重置变换组件。","category":"基础操作与变换"},{"term":"Position","zh":"位置","desc":"物体在空间中的坐标","example":"Change the position.","translation":"修改位置。","category":"基础操作与变换"},{"term":"Rotation","zh":"旋转","desc":"物体绕坐标轴的角度","example":"Adjust the rotation.","translation":"调整旋转。","category":"基础操作与变换"},{"term":"Scale","zh":"缩放","desc":"物体在各轴上的尺寸比例","example":"Scale the model uniformly.","translation":"等比例缩放模型。","category":"基础操作与变换"},{"term":"Move","zh":"移动","desc":"移动工具，快捷键通常为 W","example":"Move the object to the left.","translation":"将物体向左移动。","category":"基础操作与变换"},{"term":"Rotate","zh":"旋转工具","desc":"旋转工具，快捷键通常为 E","example":"Rotate the object around the Y axis.","translation":"让物体绕 Y 轴旋转。","category":"基础操作与变换"},{"term":"Scale Tool","zh":"缩放工具","desc":"缩放工具，快捷键通常为 R","example":"Use the Scale tool.","translation":"使用缩放工具。","category":"基础操作与变换"},{"term":"Rect Tool","zh":"矩形工具","desc":"常用于 UI 矩形区域编辑","example":"Resize the UI element.","translation":"调整 UI 元素大小。","category":"基础操作与变换"},{"term":"Hand Tool","zh":"手形工具","desc":"平移场景视图","example":"Pan the Scene view.","translation":"平移场景视图。","category":"基础操作与变换"},{"term":"Select","zh":"选择","desc":"选中对象或资源","example":"Select the target object.","translation":"选择目标对象。","category":"基础操作与变换"},{"term":"Duplicate","zh":"复制","desc":"创建对象副本","example":"Duplicate the tree.","translation":"复制这棵树。","category":"基础操作与变换"},{"term":"Delete","zh":"删除","desc":"移除对象或资源","example":"Delete the selected object.","translation":"删除选中的对象。","category":"基础操作与变换"},{"term":"Rename","zh":"重命名","desc":"修改对象名称","example":"Rename the GameObject.","translation":"给游戏对象重命名。","category":"基础操作与变换"},{"term":"Create Empty","zh":"创建空对象","desc":"创建没有可见网格的对象","example":"Create an empty parent object.","translation":"创建一个空父对象。","category":"基础操作与变换"},{"term":"Parent","zh":"父对象","desc":"层级中的上级对象","example":"Make this object the parent.","translation":"将此对象设为父对象。","category":"基础操作与变换"},{"term":"Child","zh":"子对象","desc":"层级中隶属于父对象的对象","example":"Move the mesh under the parent.","translation":"将网格对象移到父对象下。","category":"基础操作与变换"},{"term":"Pivot","zh":"轴心点","desc":"物体旋转或缩放所围绕的点","example":"Move the pivot to the center.","translation":"把轴心点移到中心。","category":"基础操作与变换"},{"term":"Center","zh":"中心","desc":"按对象中心进行操作或显示","example":"Frame the selected object.","translation":"框选聚焦选中的对象。","category":"基础操作与变换"},{"term":"Global","zh":"全局","desc":"使用世界坐标方向","example":"Switch to Global orientation.","translation":"切换到全局方向。","category":"基础操作与变换"},{"term":"Local","zh":"局部","desc":"使用对象自身坐标方向","example":"Switch to Local orientation.","translation":"切换到局部方向。","category":"基础操作与变换"},{"term":"World Space","zh":"世界空间","desc":"整个场景共用的坐标空间","example":"Place the object in world space.","translation":"在世界空间中放置对象。","category":"基础操作与变换"},{"term":"Local Space","zh":"局部空间","desc":"相对于父对象或自身的坐标空间","example":"Check the local position.","translation":"检查局部位置。","category":"基础操作与变换"},{"term":"Grid","zh":"网格","desc":"帮助对齐和定位的参考线","example":"Align the wall to the grid.","translation":"将墙体对齐网格。","category":"基础操作与变换"},{"term":"Snap","zh":"吸附","desc":"按指定间隔移动或旋转","example":"Enable grid snapping.","translation":"启用网格吸附。","category":"基础操作与变换"},{"term":"Gizmo","zh":"辅助图示","desc":"显示坐标轴、灯光或摄像机图标","example":"Toggle the Gizmos.","translation":"切换辅助图示显示。","category":"基础操作与变换"},{"term":"Focus","zh":"聚焦","desc":"把视图定位到所选对象","example":"Focus on the selected object.","translation":"聚焦到选中的对象。","category":"基础操作与变换"},{"term":"Orbit","zh":"环绕观察","desc":"围绕目标旋转观察视角","example":"Orbit around the model.","translation":"环绕模型观察。","category":"基础操作与变换"},{"term":"Pan","zh":"平移视图","desc":"平移观察视角","example":"Pan the view to the right.","translation":"向右平移视图。","category":"基础操作与变换"},{"term":"Zoom","zh":"缩放视图","desc":"拉近或拉远观察距离","example":"Zoom in on the asset.","translation":"放大查看资源。","category":"基础操作与变换"},{"term":"Undo","zh":"撤销","desc":"撤回上一步操作","example":"Undo the last change.","translation":"撤销上一步修改。","category":"基础操作与变换"},{"term":"Redo","zh":"重做","desc":"恢复已撤销的操作","example":"Redo the operation.","translation":"重做该操作。","category":"基础操作与变换"},{"term":"Reset","zh":"重置","desc":"恢复默认值","example":"Reset the component values.","translation":"重置组件数值。","category":"基础操作与变换"},{"term":"Apply","zh":"应用","desc":"确认或应用修改","example":"Apply the changes.","translation":"应用修改。","category":"基础操作与变换"},{"term":"Revert","zh":"还原","desc":"撤回修改或覆盖","example":"Revert the prefab overrides.","translation":"还原预制体实例覆盖。","category":"基础操作与变换"},{"term":"Active","zh":"激活","desc":"对象是否处于激活状态","example":"Set the object active.","translation":"激活该对象。","category":"基础操作与变换"},{"term":"Enabled","zh":"启用","desc":"组件是否启用","example":"Enable the component.","translation":"启用组件。","category":"基础操作与变换"},{"term":"Tag","zh":"标签","desc":"按用途标记对象","example":"Assign a tag to the player.","translation":"给玩家对象指定标签。","category":"基础操作与变换"},{"term":"Layer","zh":"图层","desc":"用于渲染、射线和碰撞筛选","example":"Set the object layer.","translation":"设置对象图层。","category":"基础操作与变换"},{"term":"Static","zh":"静态","desc":"标记不会移动的对象以便某些优化","example":"Mark the building as static.","translation":"将建筑标记为静态。","category":"基础操作与变换"},{"term":"Shortcut","zh":"快捷键","desc":"快速执行命令的按键组合","example":"Learn the common shortcuts.","translation":"学习常用快捷键。","category":"基础操作与变换"},{"term":"Asset","zh":"资源","desc":"项目使用的文件或数据","example":"Import the asset.","translation":"导入资源。","category":"资源与模型"},{"term":"Assets Folder","zh":"Assets 文件夹","desc":"通常存放项目资源的目录","example":"Create a folder in Assets.","translation":"在 Assets 中创建文件夹。","category":"资源与模型"},{"term":"Folder","zh":"文件夹","desc":"组织文件的目录","example":"Organize assets into folders.","translation":"把资源整理到文件夹中。","category":"资源与模型"},{"term":"Import","zh":"导入","desc":"把文件引入项目","example":"Import the model into Unity.","translation":"将模型导入 Unity。","category":"资源与模型"},{"term":"Export","zh":"导出","desc":"把资源或数据输出到外部","example":"Export the selected asset.","translation":"导出选中的资源。","category":"资源与模型"},{"term":"FBX","zh":"FBX 模型格式","desc":"常见的三维模型交换格式","example":"Import the FBX file.","translation":"导入 FBX 文件。","category":"资源与模型"},{"term":"OBJ","zh":"OBJ 模型格式","desc":"常见的几何模型交换格式","example":"Check the OBJ model.","translation":"检查 OBJ 模型。","category":"资源与模型"},{"term":"Mesh","zh":"网格","desc":"由顶点、边和面构成的几何数据","example":"Inspect the mesh.","translation":"检查网格。","category":"资源与模型"},{"term":"Vertex","zh":"顶点","desc":"网格中的点","example":"The mesh has many vertices.","translation":"这个网格有很多顶点。","category":"资源与模型"},{"term":"Edge","zh":"边","desc":"连接顶点的线段","example":"Check the mesh edges.","translation":"检查网格边。","category":"资源与模型"},{"term":"Face","zh":"面","desc":"由边围成的多边形区域","example":"Reduce the face count.","translation":"减少面数。","category":"资源与模型"},{"term":"Polygon","zh":"多边形","desc":"模型表面的几何面","example":"The model uses low polygons.","translation":"这个模型使用低多边形结构。","category":"资源与模型"},{"term":"Topology","zh":"拓扑","desc":"模型网格的连接结构","example":"Check the topology before export.","translation":"导出前检查拓扑。","category":"资源与模型"},{"term":"Normals","zh":"法线","desc":"表示表面朝向的向量","example":"Recalculate the normals.","translation":"重新计算法线。","category":"资源与模型"},{"term":"Pivot Point","zh":"轴心点","desc":"模型自身的变换基准点","example":"Set the pivot point correctly.","translation":"正确设置轴心点。","category":"资源与模型"},{"term":"Scale Factor","zh":"缩放系数","desc":"导入模型时使用的比例系数","example":"Adjust the scale factor.","translation":"调整缩放系数。","category":"资源与模型"},{"term":"Model Import Settings","zh":"模型导入设置","desc":"控制模型导入处理方式","example":"Open Model Import Settings.","translation":"打开模型导入设置。","category":"资源与模型"},{"term":"Read/Write","zh":"读写","desc":"允许运行时访问网格数据的设置","example":"Enable Read/Write if required.","translation":"需要时启用读写。","category":"资源与模型"},{"term":"Prefab","zh":"预制体","desc":"可复用的对象模板","example":"Create a prefab from the object.","translation":"将对象制作成预制体。","category":"资源与模型"},{"term":"Prefab Variant","zh":"预制体变体","desc":"继承另一个预制体的变体","example":"Create a prefab variant.","translation":"创建预制体变体。","category":"资源与模型"},{"term":"Prefab Instance","zh":"预制体实例","desc":"场景中的预制体副本","example":"Select the prefab instance.","translation":"选择预制体实例 m","zh":"泛光","desc":"让明亮区域产生扩散光晕","example":"Add subtle bloom.","translation":"添加轻微泛光。","category":"材质贴图与渲染"},{"term":"Color Grading","zh":"颜色分级","desc":"调整整体色彩与影调","example":"Apply color grading.","translation":"应用颜色分级。","category":"材质贴图与渲染"},{"term":"Ambient Occlusion","zh":"环境光遮蔽","desc":"加强缝隙和接触处的遮蔽感","example":"Tune ambient occlusion carefully.","translation":"谨慎调整环境光遮蔽。","category":"材质贴图与渲染"},{"term":"Reflection Probe","zh":"反射探针","desc":"采集环境用于反射效果","example":"Place a reflection probe indoors.","translation":"在室内放置反射探针。","category":"材质贴图与渲染"},{"term":"Light Probe","zh":"光照探针","desc":"为动态对象提供间接光照信息","example":"Add light probes to the scene.","translation":"在场景中添加光照探针。","category":"材质贴图与渲染"},{"term":"Render Texture","zh":"渲染纹理","desc":"把摄像机输出渲染到纹理","example":"Create a render texture.","translation":"创建渲染纹理。","category":"材质贴图与渲染"},{"term":"Alpha","zh":"透明通道","desc":"常用于表示透明度的数据通道","example":"Check the alpha channel.","translation":"检查透明通道。","category":"材质贴图与渲染"},{"term":"Lighting","zh":"灯光","desc":"场景的照明设置","example":"Adjust the lighting in the scene.","translation":"调整场景灯光。","category":"灯光与摄像机"},{"term":"Light","zh":"光源","desc":"照亮场景的组件","example":"Add a light to the scene.","translation":"在场景中添加光源。","category":"灯光与摄像机"},{"term":"Directional Light","zh":"方向光","desc":"模拟太阳等远距离光源","example":"Adjust the directional light.","translation":"调整方向光。","category":"灯光与摄像机"},{"term":"Point Light","zh":"点光源","desc":"向各方向发光的局部光源","example":"Place a point light near the lamp.","translation":"在灯旁放置点光源。","category":"灯光与摄像机"},{"term":"Spot Light","zh":"聚光灯","desc":"呈锥形照射的光源","example":"Aim the spot light at the door.","translation":"将聚光灯对准门。","category":"灯光与摄像机"},{"term":"Area Light","zh":"面光源","desc":"具有面积的光源，支持情况取决于管线与模式","example":"Check area light support in your pipeline.","translation":"检查当前管线对面光源的支持。","category":"灯光与摄像机"},{"term":"Intensity","zh":"强度","desc":"光源亮度或效果强度参数","example":"Reduce the light intensity.","translation":"降低灯光强度。","category":"灯光与摄像机"},{"term":"Color Temperature","zh":"色温","desc":"以温度值表达的光色倾向","example":"Adjust the color temperature.","translation":"调整色温。","category":"灯光与摄像机"},{"term":"Range","zh":"范围","desc":"局部光源影响的距离范围","example":"Increase the light range.","translation":"增大灯光范围。","category":"灯光与摄像机"},{"term":"Shadow","zh":"阴影","desc":"遮挡光线形成的暗部","example":"Enable shadows on the light.","translation":"启用光源阴影。","category":"灯光与摄像机"},{"term":"Shadow Resolution","zh":"阴影分辨率","desc":"阴影贴图精细程度","example":"Increase shadow resolution if necessary.","translation":"必要时提高阴影分辨率。","category":"灯光与摄像机"},{"term":"Baked Lighting","zh":"烘焙光照","desc":"预先计算并保存的光照结果","example":"Bake lighting for static geometry.","translation":"为静态几何体烘焙光照。","category":"灯光与摄像机"},{"term":"Realtime Lighting","zh":"实时光照","desc":"运行时计算的光照","example":"Use realtime lighting selectively.","translation":"有选择地使用实时光照。","category":"灯光与摄像机"},{"term":"Mixed Lighting","zh":"混合光照","desc":"结合实时与预计算光照的模式","example":"Configure mixed lighting.","translation":"配置混合光照。","category":"灯光与摄像机"},{"term":"Lightmap","zh":"光照贴图","desc":"存储预计算光照信息的贴图","example":"Inspect the lightmap.","translation":"检查光照贴图。","category":"灯光与摄像机"},{"term":"Lightmapping","zh":"光照贴图烘焙","desc":"生成光照贴图的过程","example":"Start the lightmapping process.","translation":"开始生成光照贴图。","category":"灯光与摄像机"},{"term":"Environment Lighting","zh":"环境光照","desc":"场景整体环境照明","example":"Tune environment lighting.","translation":"调整环境光照。","category":"灯光与摄像机"},{"term":"Skybox","zh":"天空盒","desc":"用作天空和远景背景的材质或环境","example":"Assign a skybox.","translation":"指定天空盒。","category":"灯光与摄像机"},{"term":"Reflection","zh":"反射","desc":"表面对环境的反射效果","example":"Improve reflections on the floor.","translation":"改善地面的反射。","category":"灯光与摄像机"},{"term":"Camera","zh":"摄像机","desc":"决定观察位置和画面","example":"Move the camera to frame the scene.","translation":"移动摄像机为场景构图。","category":"灯光与摄像机"},{"term":"Field of View","zh":"视野角度","desc":"透视摄像机的视野范围角度","example":"Adjust the field of view.","translation":"调整视野角度。","category":"灯光与摄像机"},{"term":"Clipping Planes","zh":"裁剪平面","desc":"定义摄像机可见的近远距离","example":"Set the clipping planes.","translation":"设置裁剪平面。","category":"灯光与摄像机"},{"term":"Near Clip Plane","zh":"近裁剪平面","desc":"摄像机可见范围的最近边界","example":"Adjust the near clip plane carefully.","translation":"谨慎调整近裁剪平面。","category":"灯光与摄像机"},{"term":"Far Clip Plane","zh":"远裁剪平面","desc":"摄像机可见范围的最远边界","example":"Set the far clip plane.","translation":"设置远裁剪平面。","category":"灯光与摄像机"},{"term":"Perspective","zh":"透视投影","desc":"近大远小的投影方式","example":"Use perspective for a third-person view.","translation":"第三人称视角使用透视投影。","category":"灯光与摄像机"},{"term":"Orthographic","zh":"正交投影","desc":"不产生近大远小变化的投影","example":"Use orthographic projection for a map.","translation":"地图可以使用正交投影。","category":"灯光与摄像机"},{"term":"Aspect Ratio","zh":"宽高比","desc":"画面宽度与高度的比例","example":"Check the aspect ratio.","translation":"检查宽高比。","category":"灯光与摄像机"},{"term":"Viewport","zh":"视口","desc":"摄像机画面所在区域","example":"Adjust the camera viewport.","translation":"调整摄像机视口。","category":"灯光与摄像机"},{"term":"Depth of Field","zh":"景深","desc":"模拟不同距离清晰度变化的效果","example":"Use depth of field sparingly.","translation":"谨慎使用景深。","category":"灯光与摄像机"},{"term":"Motion Blur","zh":"运动模糊","desc":"模拟运动造成的模糊","example":"Disable motion blur if it hurts clarity.","translation":"如果影响清晰度就关闭运动模糊。","category":"灯光与摄像机"},{"term":"Exposure","zh":"曝光","desc":"控制画面整体亮度的参数","example":"Adjust the exposure.","translation":"调整曝光。","category":"灯光与摄像机"},{"term":"Culling Mask","zh":"剔除遮罩","desc":"控制摄像机渲染哪些图层","example":"Set the camera culling mask.","translation":"设置摄像机剔除遮罩。","category":"灯光与摄像机"},{"term":"Terrain","zh":"地形","desc":"用于构建大面积地表的对象","example":"Create a terrain for the level.","translation":"为关卡创建地形。","category":"地形与环境美术"},{"term":"Terrain Tool","zh":"地形工具","desc":"编辑地形的工具集合","example":"Open the terrain tools.","translation":"打开地形工具。","category":"地形与环境美术"},{"term":"Brush","zh":"笔刷","desc":"用于雕刻或绘制地形的工具","example":"Increase the brush size.","translation":"增大笔刷大小。","category":"地形与环境美术"},{"term":"Brush Size","zh":"笔刷大小","desc":"笔刷影响区域的尺寸","example":"Adjust the brush size.","translation":"调整笔刷大小。","category":"地形与环境美术"},{"term":"Brush Strength","zh":"笔刷强度","desc":"笔刷每次操作的影响力度","example":"Lower the brush strength.","translation":"降低笔刷强度。","category":"地形与环境美术"},{"term":"Raise or Lower Terrain","zh":"抬高或降低地形","desc":"改变地表高度","example":"Raise the terrain near the cliff.","translation":"在悬崖附近抬高地形。","category":"地形与环境美术"},{"term":"Set Height","zh":"设置高度","desc":"将笔刷区域调整到指定高度","example":"Set the plateau height.","translation":"设置高原高度。","category":"地形与环境美术"},{"term":"Smooth Height","zh":"平滑高度","desc":"平滑突兀的地形起伏","example":"Smooth the edge of the hill.","translation":"平滑山丘边缘。","category":"地形与环境美术"},{"term":"Paint Texture","zh":"绘制纹理","desc":"在地表绘制不同材质","example":"Paint dirt along the path.","translation":"沿路径绘制泥土。","category":"地形与环境美术"},{"term":"Terrain Layer","zh":"地形图层","desc":"定义地形使用的表面材质与贴图","example":"Add a terrain layer.","translation":"添加地形图层。","category":"地形与环境美术"},{"term":"Paint Trees","zh":"绘制树木","desc":"在地形上散布树木","example":"Paint trees on the hillside.","translation":"在山坡上绘制树木。","category":"地形与环境美术"},{"term":"Paint Details","zh":"绘制细节","desc":"散布草等细节对象","example":"Paint grass details.","translation":"绘制草地细节。","category":"地形与环境美术"},{"term":"Foliage","zh":"植被","desc":"草、灌木和树木等植物资源","example":"Place foliage near the rocks.","translation":"在岩石附近放置植被。","category":"地形与环境美术"},{"term":"Tree Density","zh":"树木密度","desc":"单位区域内树木的分布密度","example":"Reduce tree density near the path.","translation":"降低路径附近的树木密度。","category":"地形与环境美术"},{"term":"Detail Density","zh":"细节密度","desc":"地形细节的分布密度","example":"Lower detail density for performance.","translation":"降低细节密度以改善性能。","category":"地形与环境美术"},{"term":"Terrain Holes","zh":"地形孔洞","desc":"地形表面的可挖空区域","example":"Create a terrain hole for the cave.","translation":"为洞穴创建地形孔洞。","category":"地形与环境美术"},{"term":"Terrain Collider","zh":"地形碰撞体","desc":"让角色和物体与地形发生碰撞","example":"Check the terrain collider.","translation":"检查地形碰撞体。","category":"地形与环境美术"},{"term":"Rock","zh":"岩石","desc":"常见的环境模型","example":"Scatter rocks along the slope.","translation":"沿坡面摆放岩石。","category":"地形与环境美术"},{"term":"Cliff","zh":"悬崖","desc":"陡峭的地形边缘","example":"Create a readable cliff silhouette.","translation":"塑造清晰的悬崖轮廓。","category":"地形与环境美术"},{"term":"Slope","zh":"坡面","desc":"倾斜的地表","example":"Check the slope angle.","translation":"检查坡面角度。","category":"地形与环境美术"},{"term":"Path","zh":"路径","desc":"玩家可能行进的路线","example":"Create a path through the ruins.","translation":"在遗迹中创建路径。","category":"地形与环境美术"},{"term":"Road","zh":"道路","desc":"人工铺设的通行区域","example":"Connect the road to the entrance.","translation":"让道路连接入口。","category":"地形与环境美术"},{"term":"Vegetation","zh":"植被","desc":"植物环境元素的统称","example":"Add vegetation to the scene.","translation":"为场景添加植被。","category":"地形与环境美术"},{"term":"Tree","zh":"树木","desc":"环境中的树模型","example":"Place a tree as a landmark.","translation":"把树作为地标摆放。","category":"地形与环境美术"},{"term":"Grass","zh":"草","desc":"地表植物或草地材质","example":"Paint grass around the stones.","translation":"在石头周围绘制草地。","category":"地形与环境美术"},{"term":"Clutter","zh":"零碎环境物","desc":"小石头、枝条等环境细节","example":"Avoid excessive clutter.","translation":"避免放置过多零碎物。","category":"地形与环境美术"},{"term":"Decal","zh":"贴花","desc":"投射在表面的细节图案","example":"Add a decal to the wall.","translation":"在墙上添加贴花。","category":"地形与环境美术"},{"term":"Skybox","zh":"天空盒","desc":"环境背景","example":"Choose a cloudy skybox.","translation":"选择多云天空盒。","category":"地形与环境美术"},{"term":"Fog","zh":"雾","desc":"用于远景和氛围的雾效","example":"Add subtle fog to the valley.","translation":"为山谷添加轻微雾效。","category":"地形与环境美术"},{"term":"Wind Zone","zh":"风区","desc":"影响支持风效果的植被","example":"Place a wind zone near the trees.","translation":"在树木附近放置风区。","category":"地形与环境美术"},{"term":"Environment","zh":"环境","desc":"关卡中的整体场景空间","example":"Build a coherent environment.","translation":"构建统一的环境。","category":"地形与环境美术"},{"term":"Set Dressing","zh":"场景布置","desc":"摆放物件以丰富叙事与空间","example":"Finish the set dressing.","translation":"完成场景布置。","category":"地形与环境美术"},{"term":"Composition","zh":"构图","desc":"画面元素的组织方式","example":"Improve the composition.","translation":"改善构图。","category":"地形与环境美术"},{"term":"Silhouette","zh":"剪影","desc":"物体整体外轮廓","example":"Keep the building silhouette clear.","translation":"保持建筑剪影清晰。","category":"地形与环境美术"},{"term":"Level Design","zh":"关卡设计","desc":"规划空间、路线、挑战和玩家体验","example":"Plan the level before detailing it.","translation":"先规划关卡再添加细节。","category":"关卡设计与玩家体验"},{"term":"Level","zh":"关卡","desc":"玩家游玩的一个区域或阶段","example":"Test the level from start to finish.","translation":"从头到尾测试关卡。","category":"关卡设计与玩家体验"},{"term":"Blockout","zh":"白盒搭建","desc":"用简单几何体验证布局","example":"Build a blockout before adding details.","translation":"添加细节前先搭建白盒。","category":"关卡设计与玩家体验"},{"term":"Greybox","zh":"灰盒","desc":"以简单形体验证玩法和空间的阶段","example":"Use greybox geometry to test movement.","translation":"使用灰盒几何体测试移动。","category":"关卡设计与玩家体验"},{"term":"Layout","zh":"布局","desc":"空间与主要元素的组织方式","example":"Review the level layout.","translation":"检查关卡布局。","category":"关卡设计与玩家体验"},{"term":"Landmark","zh":"地标","desc":"帮助玩家辨认方向的视觉标志","example":"Add a landmark to guide the player.","translation":"添加地标引导玩家。","category":"关卡设计与玩家体验"},{"term":"Player Flow","zh":"玩家流线","desc":"玩家在关卡中的移动与体验路径","example":"Improve player flow through the area.","translation":"改善玩家在该区域的流线。","category":"关卡设计与玩家体验"},{"term":"Sightline","zh":"视线通道","desc":"玩家能看见的方向和范围","example":"Keep the main sightline open.","translation":"保持主要视线通畅。","category":"关卡设计与玩家体验"},{"term":"Line of Sight","zh":"视线","desc":"观察者与目标之间的可见关系","example":"Check the line of sight.","translation":"检查视线关系。","category":"关卡设计与玩家体验"},{"term":"Focal Point","zh":"视觉焦点","desc":"吸引注意力的主要画面元素","example":"Place a focal point in the distance.","translation":"在远处设置视觉焦点。","category":"关卡设计与玩家体验"},{"term":"Choke Point","zh":"狭窄通道","desc":"限制通行宽度的关键区域","example":"Use the choke point carefully.","translation":"谨慎设计狭窄通道。","category":"关卡设计与玩家体验"},{"term":"Cover","zh":"掩体","desc":"提供遮挡的环境物体","example":"Add cover near the combat area.","translation":"在战斗区域附近添加掩体。","category":"关卡设计与玩家体验"},{"term":"Traversal","zh":"通行方式","desc":"玩家穿越空间的方式","example":"Test traversal across the rocks.","translation":"测试穿越岩石区域的方式。","category":"关卡设计与玩家体验"},{"term":"Verticality","zh":"垂直空间设计","desc":"利用高低差构建玩法与视觉层次","example":"Use verticality to create choices.","translation":"利用垂直空间创造选择。","category":"关卡设计与玩家体验"},{"term":"Pacing","zh":"节奏","desc":"挑战、探索与休息的安排节奏","example":"Adjust the pacing of the level.","translation":"调整关卡节奏。","category":"关卡设计与玩家体验"},{"term":"Encounter","zh":"遭遇战","desc":"玩家与敌人或事件的交互场景","example":"Place an encounter after the bridge.","translation":"在桥后安排一次遭遇战。","category":"关卡设计与玩家体验"},{"term":"Checkpoint","zh":"检查点","desc":"保存进度或重生的位置","example":"Place a checkpoint near the entrance.","translation":"在入口附近放置检查点。","category":"关卡设计与玩家体验"},{"term":"Spawn Point","zh":"出生点","desc":"角色或对象生成的位置","example":"Set the player spawn point.","translation":"设置玩家出生点。","category":"关卡设计与玩家体验"},{"term":"Objective","zh":"目标","desc":"玩家需要完成的任务","example":"Make the objective clear.","translation":"让目标清晰易懂。","category":"关卡设计与玩家体验"},{"term":"Quest","zh":"任务","desc":"具有目标和进度的游戏内容","example":"Connect the quest to the level.","translation":"将任务与关卡联系起来。","category":"关卡设计与玩家体验"},{"term":"Puzzle","zh":"谜题","desc":"需要玩家思考或操作解决的挑战","example":"Test the puzzle from the player's view.","translation":"从玩家视角测试谜题。","category":"关卡设计与玩家体验"},{"term":"Navigation","zh":"导航","desc":"判断方向并移动到目标的过程","example":"Improve navigation with landmarks.","translation":"用地标改善导航。","category":"关卡设计与玩家体验"},{"term":"Readability","zh":"可读性","desc":"玩家能否快速理解空间和信息","example":"Improve the readability of the route.","translation":"提高路线的可读性。","category":"关卡设计与玩家体验"},{"term":"Tutorialization","zh":"教学引导设计","desc":"逐步教会玩家规则的设计方法","example":"Introduce one mechanic at a time.","translation":"一次引入一种机制。","category":"关卡设计与玩家体验"},{"term":"Risk and Reward","zh":"风险与奖励","desc":"风险与收益之间的设计关系","example":"Balance risk and 使用胶囊碰撞体。","category":"物理碰撞与导航"},{"term":"Mesh Collider","zh":"网格碰撞体","desc":"根据网格形状进行碰撞检测","example":"Use mesh colliders selectively.","translation":"有选择地使用网格碰撞体。","category":"物理碰撞与导航"},{"term":"Is Trigger","zh":"触发器模式","desc":"不产生普通实体阻挡而用于检测进入区域","example":"Enable Is Trigger on the volume.","translation":"在区域对象上启用 Is Trigger。","category":"物理碰撞与导航"},{"term":"Rigidbody","zh":"刚体","desc":"参与物理模拟的组件","example":"Add a Rigidbody to the crate.","translation":"给木箱添加刚体。","category":"物理碰撞与导航"},{"term":"Mass","zh":"质量","desc":"刚体的质量参数","example":"Adjust the mass.","translation":"调整质量。","category":"物理碰撞与导航"},{"term":"Drag","zh":"阻力","desc":"旧版刚体 API 中的线性阻力参数","example":"Tune the drag value if applicable.","translation":"在适用时调整阻力值。","category":"物理碰撞与导航"},{"term":"Gravity","zh":"重力","desc":"使物体向下加速的作用","example":"Enable gravity on the rigidbody.","translation":"为刚体启用重力。","category":"物理碰撞与导航"},{"term":"Kinematic","zh":"运动学模式","desc":"不由常规物理力驱动的刚体模式","example":"Use kinematic mode when appropriate.","translation":"在合适情况下使用运动学模式。","category":"物理碰撞与导航"},{"term":"Physics Material","zh":"物理材质","desc":"控制摩擦和弹性的资源","example":"Assign a physics material.","translation":"指定物理材质。","category":"物理碰撞与导航"},{"term":"Friction","zh":"摩擦","desc":"接触表面间阻碍滑动的作用","example":"Increase friction on the floor.","translation":"增加地面的摩擦。","category":"物理碰撞与导航"},{"term":"Bounciness","zh":"弹性","desc":"碰撞后反弹的程度","example":"Reduce bounciness.","translation":"降低弹性。","category":"物理碰撞与导航"},{"term":"Collision","zh":"碰撞","desc":"物体接触时的物理事件","example":"Check the collision settings.","translation":"检查碰撞设置。","category":"物理碰撞与导航"},{"term":"Layer Mask","zh":"图层遮罩","desc":"指定哪些图层参与检测","example":"Set the layer mask for the raycast.","translation":"为射线检测设置图层遮罩。","category":"物理碰撞与导航"},{"term":"Raycast","zh":"射线检测","desc":"沿直线检测命中的对象","example":"Use a raycast to detect the ground.","translation":"用射线检测地面。","category":"物理碰撞与导航"},{"term":"Ray","zh":"射线","desc":"从起点沿方向延伸的数学线","example":"Draw a ray for debugging.","translation":"绘制射线 ,"example":"Inspect the hand bone.","translation":"检查手部骨骼。","category":"动画与角色"},{"term":"Avatar Mask","zh":"角色遮罩","desc":"限制动画影响的身体部位","example":"Use an avatar mask for upper-body actions.","translation":"用角色遮罩控制上半身动作。","category":"动画与角色"},{"term":"IK","zh":"反向运动学","desc":"根据目标位置求解关节姿态","example":"Use IK to place the hand.","translation":"用反向运动学定位手部。","category":"动画与角色"},{"term":"Retargeting","zh":"动画重定向","desc":"将动画适配到不同骨架","example":"Retarget the animation to the character.","translation":"将动画重定向到角色。","category":"动画与角色"},{"term":"Blend Shape","zh":"混合形状","desc":"通过顶点变形表达表情或形态变化","example":"Animate the blend shape.","translation":"为混合形状制作动画。","category":"动画与角色"},{"term":"Skinned Mesh Renderer","zh":"蒙皮网格渲染器","desc":"显示受骨骼影响的网格","example":"Check the Skinned Mesh Renderer.","translation":"检查蒙皮网格渲染器。","category":"动画与角色"},{"term":"Timeline","zh":"时间轴","desc":"编排动画、音频和事件的工具","example":"Create a Timeline sequence.","translation":"创建时间轴序列。","category":"动画与角色"},{"term":"Cinemachine","zh":"虚拟摄像机工具包","desc":"帮助构建镜头行为的工具","example":"Use Cinemachine for camera control.","translation":"使用 Cinemachine 控制镜头。","category":"动画与角色"},{"term":"Character","zh":"角色","desc":"玩家或非玩家人物","example":"Set up the character controller.","translation":"配置角色控制器。","category":"动画与角色"},{"term":"Player Controller","zh":"玩家控制器","desc":"处理玩家移动和输入的逻辑","example":"Test the player controller.","translation":"测试玩家控制器。","category":"动画与角色"},{"term":"Movement","zh":"移动","desc":"角色或物体的位置变化","example":"Tune character movement.","translation":"调整角色移动。","category":"动画与角色"},{"term":"Idle","zh":"待机","desc":"没有主动移动时的状态","example":"Play the idle animation.","translation":"播放待机动画。","category":"动画与角色"},{"term":"Walk","zh":"行走","desc":"步行状态或动画","example":"Blend idle and walk.","translation":"混合待机和行走。","category":"动画与角色"},{"term":"Run","zh":"奔跑","desc":"快速移动状态","example":"Add a run animation.","translation":"添加奔跑动画。","category":"动画与角色"},{"term":"Jump","zh":"跳跃","desc":"角色离开地面的动作","example":"Test the jump animation.","translation":"测试跳跃动画。","category":"动画与角色"},{"term":"Root Bone","zh":"根骨骼","desc":"骨架层级中的根骨骼","example":"Check the root bone assignment.","translation":"检查根骨骼分配。","category":"动画与角色"},{"term":"UI","zh":"用户界面","desc":"玩家操作和读取信息的界面","example":"Create a simple UI.","translation":"创建一个简单界面。","category":"UI与输入"},{"term":"Canvas","zh":"画布","desc":"UI 元素的主要容器","example":"Create a Canvas.","translation":"创建画布。","category":"UI与输入"},{"term":"Rect Transform","zh":"矩形变换","desc":"UI 元素的位置、尺寸和锚点组件","example":"Adjust the Rect Transform.","translation":"调整矩形变换。","category":"UI与输入"},{"term":"Anchor","zh":"锚点","desc":"定义 UI 相对父容器的位置基准","example":"Set the anchors correctly.","translation":"正确设置锚点。","category":"UI与输入"},{"term":"Pivot","zh":"枢轴点","desc":"UI 矩形变换的参考点","example":"Adjust the pivot.","translation":"调整枢轴点。","category":"UI与输入"},{"term":"Button","zh":"按钮","desc":"可点击的交互元素","example":"Add a button to the menu.","translation":"给菜单添加按钮。","category":"UI与输入"},{"term":"Text","zh":"文本","desc":"显示文字的 UI 元素或文本数据","example":"Change the text label.","translation":"修改文字标签。","category":"UI与输入"},{"term":"TextMeshPro","zh":"TextMeshPro 文本","desc":"Unity 常用的高质量文本系统","example":"Use TextMeshPro for UI text.","translation":"使用 TextMeshPro 显示 UI 文本。","category":"UI与输入"},{"term":"Image","zh":"图像","desc":"显示图片的 UI 元素","example":"Assign a sprite to the image.","translation":"为图像组件指定精灵。","category":"UI与输入"},{"term":"Sprite","zh":"精灵","desc":"常用于 2D 的图像资源","example":"Import the sprite.","translation":"导入精灵。","category":"UI与输入"},{"term":"Panel","zh":"面板","desc":"承载一组 UI 元素的区域","example":"Create a settings panel.","translation":"创建设置面板。","category":"UI与输入"},{"term":"Layout Group","zh":"布局组","desc":"自动排列子 UI 元素","example":"Add a layout group.","translation":"添加布局组。","category":"UI与输入"},{"term":"Grid Layout Group","zh":"网格布局组","desc":"按网格排列子元素","example":"Use a grid layout for the icons.","translation":"使用网格布局排列图标。","category":"UI与输入"},{"term":"Vertical Layout Group","zh":"垂直布局组","desc":"按垂直方向排列子元素","example":"Stack the buttons vertically.","translation":"垂直排列按钮。","category":"UI与输入"},{"term":"Horizontal Layout Group","zh":"水平布局组","desc":"按水平方向排列子元素","example":"Align the icons horizontally.","translation":"水平对齐图标。","category":"UI与输入"},{"term":"Content Size Fitter","zh":"内容尺寸适配器","desc":"根据内容调整 UI 尺寸","example":"Fit the panel to its content.","translation":"让面板尺寸适应内容。","category":"UI与输入"},{"term":"Event System","zh":"事件系统","desc":"处理 UI 输入事件的系统","example":"Check the Event System.","translation":"检查事件系统。","category":"UI与输入"},{"term":"Input","zh":"输入","desc":"玩家的键盘、鼠标、手柄或触屏操作","example":"Read player input.","translation":"读取玩家输入。","category":"UI与输入"},{"term":"Input System","zh":"输入系统","desc":"Unity 的新输入管理方案","example":"Configure the Input System.","translation":"配置输入系统。","category":"UI与输入"},{"term":"Action Map","zh":"动作映射","desc":"将输入动作分组的配置","example":"Create an action map.","translation":"创建动作映射。","category":"UI与输入"},{"term":"Binding","zh":"绑定","desc":"将动作关联到具体输入","example":"Set a keyboard binding.","translation":"设置键盘绑定。","category":"UI与输入"},{"term":"Pointer","zh":"指针","desc":"鼠标或触摸交互的指针概念","example":"Handle pointer input.","translation":"处理指针输入。","category":"UI与输入"},{"term":"Raycast Target","zh":"射线检测目标","desc":"UI 图形是否接收图形射线检测","example":"Disable Raycast Target on decoration.","translation":"关闭装饰图的射线检测目标。","category":"UI与输入"},{"term":"Responsive UI","zh":"自适应界面","desc":"适配不同屏幕尺寸的 UI","example":"Test responsive UI on mobile.","translation":"在手机上测试自适应界面。","category":"UI与输入"},{"term":"Safe Area","zh":"安全区域","desc":"避开刘海和系统指示区域的布局范围","example":"Respect the safe area.","translation":"遵守安全区域。","category":"UI与输入"},{"term":"Resolution","zh":"分辨率","desc":"画面像素尺寸","example":"Test a different resolution.","translation":"测试不同分辨率。","category":"UI与输入"},{"term":"Aspect Ratio","zh":"宽高比","desc":"屏幕宽度与高度的比例","example":"Check the aspect ratio.","translation":"检查宽高比。","category":"UI与输入"},{"term":"Touch Input","zh":"触摸输入","desc":"通过触屏进行交互","example":"Test touch input on the device.","translation":"在设备上测试触摸输入。","category":"UI与输入"},{"term":"Drag and Drop","zh":"拖放","desc":"拖动元素并放到目标位置","example":"Implement drag and drop.","translation":"实现拖放功能。","category":"UI与输入"},{"term":"Tooltip","zh":"提示框","desc":"悬停或操作时显示的简短说明","example":"Add a tooltip to the icon.","translation":"给图标添加提示框。","category":"UI与输入"},{"term":"C#","zh":"C# 编程语言","desc":"Unity 常用的脚本语言","example":"Create a C# script.","translation":"创建 C# 脚本。","category":"C# 编程入门"},{"term":"Script","zh":"脚本","desc":"包含程序逻辑的代码文件","example":"Attach the script to the object.","translation":"将脚本挂到对象上。","category":"C# 编程入门"},{"term":"Class","zh":"类","desc":"组织数据与行为的代码结构","example":"Define a class for the door.","translation":"为门定义一个类。","category":"C# 编程入门"},{"term":"Method","zh":"方法","desc":"执行特定任务的代码块","example":"Call the method.","translation":"调用该方法。","category":"C# 编程入门"},{"term":"Variable","zh":"变量","desc":"保存数据的命名位置","example":"Create a variable for speed.","translation":"为速度创建变量。","category":"C# 编程入门"},{"term":"Field","zh":"字段","desc":"类中声明的数据成员","example":"Declare a field.","translation":"声明一个字段。","category":"C# 编程入门"},{"term":"Property","zh":"属性","desc":"通过访问器暴露或控制数据","example":"Create a property for health.","translation":"为生命值创建属性。","category":"C# 编程入门"},{"term":"Parameter","zh":"参数","desc":"方法接收的输入值","example":"Pass a parameter to the method.","translation":"向方法传递参数。","category":"C# 编程入门"},{"term":"Argument","zh":"实参","desc":"调用方法时传入的具体值","example":"Check the argument.","translation":"检查实参。","category":"C# 编程入门"},{"term":"Return","zh":"返回","desc":"从方法返回结果或结束执行","example":"Return the result.","translation":"返回结果。","category":"C# 编程入门"},{"term":"Void","zh":"无返回值","desc":"表示方法不返回值的类型","example":"Use void when no value is returned.","translation":"没有返回值时使用 void。","category":"C# 编程入门"},{"term":"String","zh":"字符串","desc":"文本数据类型","example":"Store the name in a string.","translation":"用字符串保存名称。","category":"C# 编程入门"},{"term":"Integer","zh":"整数","desc":"不带小数的整数类型概念","example":"Use an integer for the item count.","translation":"用整数记录物品数量。","category":"C# 编程入门"},{"term":"Float","zh":"浮点数","desc":"可表示小数的数值类型","example":"Use a float for movement speed.","translation":"用浮点数表示移动速度。","category":"C# 编程入门"},{"term":"Boolean","zh":"布尔值","desc":"true 或 false 的逻辑值","example":"Use a boolean for the door state.","translation":"用布尔值记录门的状态。","category":"C# 编程入门"},{"term":"Array","zh":"数组","desc":"一组固定长度的同类型元素","example":"Create an array of objects.","translation":"创建对象数组。","category":"C# 编程入门"},{"term":"List","zh":"列表","desc":"可动态增减元素的集合","example":"Store the props in a list.","translation":"用列表存放道具。","category":"C# 编程入门"},{"term":"If Statement","zh":"条件语句","desc":"根据条件决定是否执行代码","example":"Use an if statement to check the key.","translation":"用条件语句检查钥匙。","category":"C# 编程入门"},{"term":"Else","zh":"否则","desc":"条件不成立时执行的分支","example":"Add an else branch.","translation":"添加 else 分支。","category":"C# 编程入门"},{"term":"Loop","zh":"循环","desc":"重复执行一段代码","example":"Use a loop to process the objects.","translation":"用循环处理对象。","category":"C# 编程入门"},{"term":"For Loop","zh":"for 循环","desc":"按初始化、条件和迭代控制的循环","example":"Use a for loop to count the items.","translation":"用 for 循环统计物品。","category":"C# 编程入门"},{"term":"Foreach","zh":"foreach 循环","desc":"遍历集合中的元素","example":"Use foreach to inspect each object.","translation":"用 foreach 检查每个对象。","category":"C# 编程入门"},{"term":"Function","zh":"函数","desc":"可复用的一段功能逻辑，C# 中通常称 method","example":"Write a function for interaction.","translation":"为交互编写方法。","category":"C# 编程入门"},{"term":"Namespace","zh":"命名空间","desc":"组织相关类型并避免名称冲突","example":"Add the namespace.","translation":"添加命名空间。","category":"C# 编程入门"},{"term":"Using Directive","zh":"using 指令","desc":"引入命名空间或别名","example":"Add the required using directive.","translation":"添加所需 using 指令。","category":"C# 编程入门"},{"term":"Public","zh":"公共","desc":"允许其他代码访问的访问修饰符","example":"Make the field public if needed.","translation":"需要时将字段设为公共。","category":"C# 编程入门"},{"term":"Private","zh":"私有","desc":"限制成员只能在定义类型内部访问","example":"Keep the field private when possible.","translation":"尽可能将字段设为私有。","category":"C# 编程入门"},{"term":"Static","zh":"静态","desc":"属于类型本身而非实例的成员修饰符","example":"Use a static method when appropriate.","translation":"合适时使用静态方法。","category":"C# 编程入门"},{"term":"New","zh":"新建","desc":"创建对象或实例的关键字","example":"Create a new instance.","translation":"创建一个新实例。","category":"C# 编程入门"},{"term":"Null","zh":"空引用","desc":"不指向对象的引用值","example":"Check whether the reference is null.","translation":"检查引用是否为空。","category":"C# 编程入门"},{"term":"Debug.Log","zh":"调试日志","desc":"向 Console 输出调试信息","example":"Print the value with Debug.Log.","translation":"使用 Debug.Log 输出数值。","category":"C# 编程入门"},{"term":"Start","zh":"启动方法","desc":"对象启用后初始化阶段调用的方法","example":"Initialize the object in Start.","translation":"在 Start 中初始化对象。","category":"C# 编程入门"},{"term":"Awake","zh":"唤醒方法","desc":"常用于组件初始化的生命周期方法","example":"Cache references in Awake.","translation":"在 Awake 中缓存引用。","category":"C# 编程入门"},{"term":"Update","zh":"逐帧更新","desc":"每帧调用的方法","example":"Read input in Update when appropriate.","translation":"适当时在 Update 中读取输入。","category":"C# 编程入门"},{"term":"FixedUpdate","zh":"固定更新","desc":"常用于物理更新的生命周期方法","example":"Apply physics in FixedUpdate.","translation":"在 FixedUpdate 中应用物理逻辑。","category":"C# 编程入门"},{"term":"Coroutine","zh":"协程","desc":"可跨帧暂停和继续执行的流程","example":"Use a coroutine for a timed action.","translation":"用协程实现定时操作。","category":"C# 编程入门"},{"term":"IEnumerator","zh":"迭代器接口","desc":"常用于 Unity 协程返回类型","example":"Return IEnumerator from the coroutine.","translation":"让协程返回 IEnumerator。","category":"C# 编程入门"},{"term":"GetComponent","zh":"获取组件","desc":"获取对象上的组件引用","example":"Get the collider component.","translation":"获取碰撞体组件。","category":"C# 编程入门"},{"term":"SerializeField","zh":"序列化字段特性","desc":"让私有字段可在 Inspector 中显示","example":"Use SerializeField for tuning values.","translation":"用 SerializeField 暴露调节参数。","category":"C# 编程入门"},{"term":"Inheritance","zh":"继承","desc":"一个类基于另一个类扩展","example":"Use inheritance carefully.","translation":"谨慎使用继承。","category":"C# 编程入门"},{"term":"Interface","zh":"接口","desc":"定义类型需实现的成员约定","example":"Create an interface for interactable objects.","translation":"为可交互对象创建接口。","category":"C# 编程入门"},{"term":"Enum","zh":"枚举","desc":"定义一组命名常量","example":"Use an enum for game states.","translation":"用枚举表示游戏状态。","category":"C# 编程入门"},{"term":"Event","zh":"事件","desc":"用于通知其他代码某事发生","example":"Raise an event when the door opens.","translation":"门打开时触发事件。","category":"C# 编程入门"},{"term":"Delegate","zh":"委托","desc":"保存对方法的引用的类型","example":"Understand delegates before using events.","translation":"使用事件前理解委托。","category":"C# 编程入门"},{"term":"Async","zh":"异步","desc":"不必阻塞当前流程的执行方式","example":"Use asynchronous loading when appropriate.","translation":"合适时使用异步加载。","category":"C# 编程入门"},{"term":"Await","zh":"等待异步结果","desc":"在异步方法中等待任务完成","example":"Await the loading task.","translation":"等待加载任务完成。","category":"C# 编程入门"},{"term":"Compile Error","zh":"编译错误","desc":"代码无法成功编译的问题","example":"Fix the compile error first.","translation":"先修复编译错误。","category":"C# 编程入门"},{"term":"Runtime Error","zh":"运行时错误","desc":"程序运行时发生的问题","example":"Check the runtime error.","translation":"检查运行时错误。","category":"C# 编程入门"},{"term":"NullReferenceException","zh":"空引用异常","desc":"访问空引用时常见的异常","example":"Fix the null reference exception.","translation":"修复空引用异常。","category":"C# 编程入门"},{"term":"Profiler","zh":"性能分析器","desc":"分析 CPU、GPU、内存等开销","example":"Open the Profiler to inspect performance.","translation":"打开性能分析器检查性能。","category":"调试性能与优化"},{"term":"Frame Rate","zh":"帧率","desc":"每秒显示的画面帧数","example":"Measure the frame rate.","translation":"测量帧率。","category":"调试性能与优化"},{"term":"FPS","zh":"每秒帧数","desc":"Frames Per Second 的缩写","example":"Aim for a stable FPS.","translation":"争取稳定帧率。","category":"调试性能与优化"},{"term":"Frame Time","zh":"帧耗时","desc":"完成一帧所用的时间","example":"Check the frame time.","translation":"检查帧耗时。","category":"调试性能与优化"},{"term":"CPU","zh":"中央处理器","desc":"执行通用程序指令的处理器","example":"Check CPU usage.","translation":"检查 CPU 使用率。","category":"调试性能与优化"},{"term":"GPU","zh":"图形处理器","desc":"负责图形计算的处理器","example":"Check GPU usage.","translation":"检查 GPU 使用率。","category":"调试性能与优化"},{"term":"Memory","zh":"内存","desc":"程序运行时使用的存储空间","example":"Monitor memory usage.","translation":"监控内存使用量。","category":"调试性能与优化"},{"term":"Garbage Collection","zh":"垃圾回收","desc":"回收不再使用的托管内存","example":"Reduce unnecessary garbage collection.","translation":"减少不必要的垃圾回收。","category":"调试性能与优化"},{"term":"Draw Call","zh":"绘制调用","desc":"向图形 API 提交绘制工作的调用","example":"Reduce excessive draw calls.","translation":"减少过多绘制调用。","category":"调试性能与优化"},{"term":"Batching","zh":"批处理","desc":"将绘制工作合并以减少开销的技术","example":"Use batching where appropriate.","translation":"适当使用批处理。","category":"调试性能与优化"},{"term":"Static Batching","zh":"静态批处理","desc":"合并适用的静态对象绘制","example":"Check static batching settings.","translation":"检查静态批处理设置。","category":"调试性能与优化"},{"term":"GPU Instancing","zh":"GPU 实例化","desc":"高效绘制共享网格和材质的多个实例","example":"Enable GPU instancing where suitable.","translation":"合适时启用 GPU 实例化。","category":"调试性能与优化"},{"term":"Occlusion Culling","zh":"遮挡剔除","desc":"不渲染被遮挡的对象","example":"Bake occlusion culling data.","translation":"烘焙遮挡剔除数据。","category":"调试性能与优化"},{"term":"Frustum Culling","zh":"视锥体剔除","desc":"不渲染摄像机视锥外的对象","example":"Understand frustum culling.","translation":"理解视锥体剔除。","category":"调试性能与优化"},{"term":"LOD","zh":"细节层级","desc":"按距离降低模型复杂度","example":"Set up LOD for distant assets.","translation":"为远处资源设置细节层级。","category":"调试性能与优化"},{"term":"Optimization","zh":"优化","desc":"改善性能、资源使用或运行效率","example":"Optimize the scene for mobile.","translation":"针对移动端优化场景。","category":"调试性能与优化"},{"term":"Bottleneck","zh":"性能瓶颈","desc":"限制整体性能的主要因素","example":"Find the performance bottleneck.","translation":"找到性能瓶颈。","category":"调试性能与优化"},{"term":"Overdraw","zh":"过度绘制","desc":"同一像素被重复绘制的情况","example":"Reduce overdraw in transparent effects.","translation":"减少透明特效的过度绘制。","category":"调试性能与优化" (()=>{'use strict';const data=JSON.parse(document.getElementById('dictionary').textContent),entries=data.entries,words=data.words,categories=data.categories;let category='全部词汇',query='',deck=[],idx=0,known=new Set(JSON.parse(localStorage.getItem('unityKnown')||'[]')),reviewOnly=false,listLimit=12,sound=true;const $=id=>document.getElementById(id);function normalize(s){return (s||'').toLowerCase().trim()}function filtered(){return entries.filter(e=>(category==='全部词汇'||e.category===category)&&(!reviewOnly||!known.has(e.term))&&(!query||[e.term,e.zh,e.desc,e.example,e.translation,e.category].some(v=>normalize(v).includes(normalize(query)))))}function rebuild(keep=true){const old=deck[idx]?.term;deck=filtered();if(!deck.length){idx=0;renderEmpty();return}let found=keep?deck.findIndex(e=>e.term===old):-1;idx=found>=0?found:Math.min(idx,deck.length-1);render()}function renderEmpty(){$('term').textContent='没有找到词条';$('meaning').textContent='试试其他关键词';$('desc').textContent='可以清空搜索，或选择其他分类。';$('example').textContent='';$('translation').textContent='';$('counter').textContent='0 个结果';$('category').textContent='搜索';$('detail').innerHTML='<span class="hint">没有匹配内容。</span>';$('wordList').innerHTML='';$('listCount').textContent='0 个';$('prev').disabled=true;$('next').disabled=true}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tokenHtml(sentence){return sentence.split(/([A-Za-z][A-Za-z'-]*|\d+(?:\.\d+)?)/g).map(t=>/^[A-Za-z][A-Za-z'-]*$/.test(t)?'<button class="word" data-word="'+escapeHtml(t)+'" type="button">'+escapeHtml(t)+'</button>':escapeHtml(t)).join('')}function render(){if(!deck.length)return renderEmpty();const e=deck[idx];$('category').textContent=e.category;$('term').textContent=e.term;$('meaning').textContent=e.zh;$('desc').textContent=e.desc;$('example').innerHTML=tokenHtml(e.example);$('translation').textContent=e.translation;$('counter').textContent=`卡片 ${idx+1} / ${deck.length}`;$('kind').textContent='术语卡 · 例句逐词可点';$('prev').disabled=idx===0;$('next').disabled=idx===deck.length-1;$('known').textContent=known.has(e.term)?'✓ 已掌握 · 取消':'✓ 标记掌握';$('known').classList.toggle('primary',known.has(e.term));$('detail').innerHTML='<span class="hint">点击例句中的任意英文单词，查看中文释义；也可播放单词或整句发音。</span>';$('progress').style.width=(known.size/Math.max(entries.length,1)*100)+'%';$('totalCount').textContent=entries.length;$('learnedCount').textContent=known.size;$('reviewCount').textContent=Math.max(entries.length-known.size,0);renderList()}function renderList(){const list=deck.slice(0,listLimit);$('wordList').innerHTML=list.map((e,i)=>`<button class="entry" data-index="${i}"><span><strong>${escapeHtml(e.term)}</strong><small>${escapeHtml(e.zh)} · ${escapeHtml(e.category)}</small></span><span class="arrow">${known.has(e.term)?'✓':'›'}</span></button>`).join('');$('listCount').textContent=`${deck.length} 个`; $('more').classList.toggle('hidden',deck.length<=listLimit)}function showDefinition(word){const key=normalize(word),d=words[key]||words[key.replace(/[.,!?;:]$/,'')];if(d){$('detail').innerHTML='<b>'+escapeHtml(d.word)+'</b> — <span style="color:var(--green);font-weight:700">'+escapeHtml(d.meaning)+'</span><div style="margin-top:4px">'+escapeHtml(d.detail)+'</div>'}else{$('detail').innerHTML='<b>'+escapeHtml(word)+'</b><div>该词在当前词典中没有独立词条。请结合完整句子理解；它可能是词形变化或专有名称。</div>'}}function speak(text,lang='en-US'){if(!sound){toast('发音已关闭');return}if(!('speechSynthesis'in window)){toast('当前浏览器不支持语音合成');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.86;const vs=window.speechSynthesis.getVoices();const v=vs.find(v=>/^en(-|_)/i.test(v.lang)&&/siri|samantha|ava|english|daniel/i.test(v.name))||vs.find(v=>/^en(-|_)/i.test(v.lang));if(v)u.voice=v;window.speechSynthesis.speak(u)}let toastTimer;function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1900)}function setCategory(c){category=c;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));idx=0;listLimit=12;rebuild(false)}$('tabs').innerHTML=['全部词汇',...categories].map(c=>`<button data-cat="${escapeHtml(c)}" class="${c==='全部词汇'?'active':''}">${escapeHtml(c)}</button>`).join('');$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b)setCategory(b.dataset.cat)});$('example').addEventListener('click',e=>{const b=e.target.closest('[data-word]');if(b)showDefinition(b.dataset.word)});$('wordList').addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b){idx=Number(b.dataset.index);render();window.scrollTo({top:0,behavior:'smooth'})}});$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('next').onclick=()=>{if(idx<deck.length-1){idx++;render()}};$('known').onclick=()=>{if(!deck.length)return;const term=deck[idx].term;if(known.has(term))known.delete(term);else known.add(term);localStorage.setItem('unityKnown',JSON.stringify([...known]));render();toast(known.has(term)?'已加入掌握列表':'已取消掌握')};$('speakWord').onclick=()=>deck[idx]&&speak(deck[idx].term);$('speakSentence').onclick=()=>deck[idx]&&speak(deck[idx].example);$('showMeaning').onclick=()=>deck[idx]&&($('detail').innerHTML='<b>'+escapeHtml(deck[idx].term)+' — '+escapeHtml(deck[idx].zh)+'</b><div>'+escapeHtml(deck[idx].desc)+'</div><div style="margin-top:5px">'+escapeHtml(deck[idx].translation)+'</div>');$('searchBtn').onclick=()=>{query=$('search').value;idx=0;listLimit=12;rebuild(false)};$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){$('searchBtn').click()}});$('search').addEventListener('input',()=>{if(!$('search').value){query='';idx=0;rebuild(false)}});$('shuffle').onclick=()=>{if(!deck.length)return;idx=Math.floor(Math.random()*deck.length);render()};$('review').onclick=()=>{reviewOnly=!reviewOnly;$('review').textContent=reviewOnly?'显示全部词汇':'复习未掌握';idx=0;rebuild(false);toast(reviewOnly?'正在复习未掌握词条':'已显示全部词条')};$('more').onclick=()=>{listLimit+=20;renderList()};$('soundToggle').onclick=()=>{sound=!sound;$('soundToggle').textContent=sound?'🔊 发音开启':'🔇 发音关闭';$('soundToggle').setAttribute('aria-pressed',String(sound));if(!sound&&window.speechSynthesis)window.speechSynthesis.cancel()};if('speechSynthesis'in window)window.speechSynthesis.getVoices();rebuild(false);})();
</script><script>if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body></html>
